<!DOCTYPE html>
<html>
<head>
    <title>Payment - AI Webpage Q&A</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        #status {
            margin: 20px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .error {
            background-color: #ffebee;
            color: #c62828;
        }
        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        iframe {
            width: 100%;
            height: 400px;
            border: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>Upgrade to Pro</h2>
    <div id="status"></div>
    <div id="loading">Initializing payment system...</div>
    <button id="payButton">Proceed to Payment</button>
    <div id="paymentFrame" style="display:none;"></div>
    <script src="payment.js"></script>
</body>
</html>
